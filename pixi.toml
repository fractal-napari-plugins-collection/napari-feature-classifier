[workspace]
name = "napari-feature-classifier"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = ">=3.11,<3.14"
napari = ">=0.7.0"
pyqt6 = "*"
ruff = "*"
pyright = "*"
pandas = "<3.0.0"

[pypi-dependencies]
napari-feature-classifier = { path = ".", editable = true, extras = ["testing"] }

[feature.local-dev.dependencies]
# zarr comes from conda (via napari); require v3 explicitly so the conda solve doesn't keep a
# zarr 2 that the pypi packages below can't use (ome-zarr>=0.13 and ngio 0.5 need zarr 3).
zarr = ">=3"

[feature.local-dev.pypi-dependencies]
napari-ome-zarr = ">=0.7.0, <0.8.0"
napari-ome-zarr-navigator = ">=0.4.0"
ipykernel = "*"

[environments]
local-dev = ["local-dev"]

[tasks]
test = "pytest -v --color=yes --cov=napari_feature_classifier --cov-report=xml"
napari = "napari"
lint = "ruff check src"
format = "ruff format src"
typecheck = "pyright src"
check = { depends-on = ["lint", "typecheck", "test"] }

[tasks.napari-ome-zarr]
cmd = "napari"
default-environment = "local-dev"

name: tests

on:
  push:
    branches:
      - main
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Headless core: no napari/Qt, no xvfb. Also asserts napari cannot be imported,
  # so a stray napari import in the core package fails CI.
  test-core:
    name: core (headless) py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for hatch-vcs to read git tags

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core only
        run: pip install -e "./core[testing]"

      - name: Assert core is headless (no napari)
        run: |
          python -c "import feature_classifier_core; import importlib.util as u; \
          assert u.find_spec('napari') is None, 'napari leaked into the core env'; \
          print('feature_classifier_core imports without napari')"

      - name: Run core tests
        run: pytest core/tests

  test:
    name: plugin ${{ matrix.platform }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for hatch-vcs to read git tags

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # these libraries enable testing on Qt on linux
      - uses: tlambert03/setup-qt-libs@v1

      # strategy borrowed from vispy for installing opengl libs on windows
      - name: Install Windows OpenGL
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 https://github.com/pyvista/gl-ci-helpers.git
          powershell gl-ci-helpers/appveyor/install_opengl.ps1

      # Install the core (editable) alongside the plugin so the plugin's exact
      # feature-classifier-core== pin resolves to this checkout, not PyPI.
      - name: Install dependencies
        run: pip install -e "./core[testing]" -e ".[testing]" pyqt6

      - name: Run tests
        uses: GabrielBB/xvfb-action@v1
        with:
          run: pytest
        env:
          CI: "true"

      - name: Coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  deploy:
    # this will run when you have tagged a commit, starting with "v*"
    # and requires that you have put your twine API key in your
    # github secrets (see readme for details)
    needs: [test-core, test]
    runs-on: ubuntu-latest
    if: contains(github.ref, 'tags')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for hatch-vcs to read git tags
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U hatchling hatch-vcs twine build
      - name: Build and publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE_API_KEY }}
        run: |
          git tag
          # Build the core first, then the plugin. Both derive the same version
          # from the tag, so the plugin's feature-classifier-core== pin matches.
          python -m build --outdir dist ./core
          python -m build --outdir dist .
          twine upload dist/*
